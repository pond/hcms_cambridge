# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  time:
    formats:
      short: "%b %-d %Y, %-l:%M%P"
      short_no_year: "%b %-d, %-l:%M%P"
      date_only: "%b %-d %Y"

  activemodel:
    models:
      forms/contact: "Message"
      forms/booking: "Booking enquiry"

    attributes:
      admin/statistic:
        location: "Location"
        path: "Path"
        count: "Hit count"
        success: "Success?"
        referrers: "Referrals"

      forms/base:
        # Short forms for e.g. validation errors
        name: "Name"
        email: "E-mail address"
        phone: "Telephone number"
        menu_selection: "Selection"
        # Long forms for labels via apphelp_label
        labels/name: "Your name"
        labels/email: "Your e-mail address"
        labels/phone: "Preferred telephone contact number"
        labels/menu_selection: "Please choose an item from the list" # Default only

      forms/contact:
        # Short forms for e.g. validation errors
        message: "Message"
        # Long forms for labels via apphelp_label
        labels/message: "What would you like to ask?"

      forms/booking:
        # Short forms for e.g. validation errors
        date: "Date"
        time: "Time"
        notes: "Notes"
        # Long forms for labels via apphelp_label
        labels/date: "Date (at least two days in advance)"
        labels/time: "Preferred time (10am or later)"
        labels/notes: "Additional notes and requests"

    errors:
      messages:
        blank: "must be provided"
      models:
        forms/contact:
          attributes:
            phone: &phone
              invalid: "format not recognised; try adding the country code in front, e.g. \"+64\" for NZ or \"+44\" for the UK"
        forms/booking:
          attributes:
            phone: *phone

  activerecord:
    models:
      article: "Article"
      page: "Page"

    attributes:
      article:
        title: "Title"
        summary: "Brief summary"
        article_hero_image: "Thumbnail photo"
        raw_editor: "Use the low-level HTML editor?"
        body: "Main article"

      event:
        title: "Title"
        summary: "Brief summary"
        event_hero_image: "Poster photo"
        raw_editor: "Use the low-level HTML editor?"
        body: "Event details"
        starts_at: "Start date and time"
        end_at: "Start date and time"
        number_of_seats: "Number of seats available"
        price_per_seat: "Price per seat"
        currency: "Currency"

      page:
        title: "Page title"
        slug: "Path / 'slug'"
        navigation_title: "Navigation title"
        page_id: "Put into a menu under which page?"
        page_type: "What kind of page is this going to be?"
        hidden: "Hidden from the navigation bar?"
        hide_date_and_time: "Hide option to choose a specific date and time?"
        raw_editor: "Use the low-level HTML editor?"
        body: "Main page text"
        form_selection_list_label: "Selection menu title"
        form_selection_list_contents: "Selection menu items"

    errors:
      messages:
        blank: "must be provided"

  misc:
    "yes": "Yes"
    "no": "No"
    required: "(required)"
    optional: "(optional)"

  models:
    page_type:
      normal: "Normal"
      contact_form: "Contact form"
      booking_form: "Booking form"
      blog: "Blog"
      events: "Events"

    revision:
      published: "Published"
      current: "Draft (%{time})"
      unpublished: "Old (%{time})"
