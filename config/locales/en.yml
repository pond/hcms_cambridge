# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  time:
    formats:
      short: "%b %-d %Y (%A), %-l:%M%P"
      short_no_year: "%b %-d (%A), %-l:%M%P"
      time_only: "%-l:%M%P"
      date_only: "%b %-d %Y (%A)"
      invoice_date: "%b %-d %Y"

  activemodel:
    models:
      forms/contact: "Message"
      forms/booking: "Booking enquiry"

    attributes:
      admin/statistic:
        location: "Location"
        path: "Path"
        count: "Hit count"
        success: "Success?"
        referrers: "Referrals"

      forms/base:
        # Short forms for e.g. validation errors
        name: "Name"
        email: "E-mail address"
        phone: "Telephone number"
        menu_selection: "Selection"
        # Long forms for labels via apphelp_label
        labels/name: "Your name"
        labels/email: "Your e-mail address"
        labels/phone: "Preferred telephone contact number"
        labels/menu_selection: "Please choose an item from the list" # Default only

      forms/contact:
        # Short forms for e.g. validation errors
        message: "Message"
        # Long forms for labels via apphelp_label
        labels/message: "What would you like to ask?"

      forms/booking:
        # Short forms for e.g. validation errors
        date: "Date"
        time: "Time"
        notes: "Notes"
        # Long forms for labels via apphelp_label
        labels/date: "Date (at least two days in advance)"
        labels/time: "Preferred time (10am or later)"
        labels/notes: "Notes and requests"

    errors:
      messages:
        blank: "must be provided"
      models:
        forms/contact:
          attributes:
            phone: &phone
              invalid: "format not recognised; try adding the country code in front, e.g. \"+64\" for NZ or \"+44\" for the UK"
        forms/booking:
          attributes:
            phone: *phone

  activerecord:
    models:
      article: "Article"
      page: "Page"

    attributes:
      article:
        title: "Title"
        summary: "Brief summary"
        article_hero_image: "Poster photo"
        raw_editor: "Use the low-level HTML editor?"
        body: "Main article"

      encounter:
        title: "Title"
        summary: "Brief summary"
        encounter_hero_image: "Poster photo"
        raw_editor: "Use the low-level HTML editor?"
        body: "Encounter details"
        location: "Location"
        price_per_seat: "Price per seat"
        price_physical: "Optional physical item price"
        name_physical: "Optional physical item name"
        price_on_application: "Price on enquiry"

      encounter_order:
        name: "Name"
        email: "E-mail address"
        phone_number: "Phone number"
        address: "Postal address to show on tax invoice"
        starts_at: "Starting date and time"
        has_physical: "Include physical product in price?"
        gift_note: "If this is a gift, do you want to add a message for the recipient?"
        notes_to_buyer: "Any other notes?"
        number_of_seats: "Number of people"
        amount_owed: "Total price"

      encounter_order_item:
        description: "Line item"
        amount_owed: "Price"

      event:
        title: "Title"
        summary: "Brief summary"
        event_hero_image: "Poster photo"
        raw_editor: "Use the low-level HTML editor?"
        body: "Event details"
        hidden: "Only visible if you have the link to it?"
        location: "Location"
        starts_at: "Start date and time"
        ends_at: "End date and time"
        number_of_seats: "Number of seats available"
        price_per_seat: "Price per seat"
        event_state: "Ticket sales"
        on_archive_action: "After it has taken place"

      order:
        name: "Name"
        email: "E-mail address"
        phone_number: "Phone number"
        address: "Home postal address"
        number_of_seats: "Number of seats"
        notes: "Any other notes?"
        amount_owed: "Total price"
        invoice_number: "Invoice number"

      page:
        title: "Page title"
        slug: "Path / 'slug'"
        navigation_title: "Navigation title"
        page_id: "Put into a menu under which page?"
        page_type: "What kind of page is this going to be?"
        hidden: "Hidden from the navigation bar?"
        hide_date_and_time: "Hide option to choose a specific date and time?"
        raw_editor: "Use the low-level HTML editor?"
        body: "Main page text"
        form_selection_list_label: "Selection menu title"
        form_selection_list_contents: "Selection menu items"

    errors:
      messages:
        blank: "must be provided"

  misc:
    "yes": "Yes"
    "no": "No"
    required: "(required)"
    optional: "(optional)"

  models:
    event_state:
      presales: "Reservations only (pre-sale)"
      reserver_purchases: "Purchase by reservation holders only"
      public_purchases: "Selling to general public"
      archived: "Archived"
      cancelled: "Cancelled"

    event_state_aasm_events:
      start_reserver_purchases: "Ask reservation holders to pay"
      start_public_purchases: "Open up for public purchases"
      archive: "Archive"
      cancel: "Cancel event"

    on_archive_action:
      keep: "Keep on page as a past event"
      hide: "Hide from page"
      move: "Move into a blog article"

    order_state:
      new: "In progress"
      reserved: "Reserved"
      paid: "Paid"
      payment_failed: "Payment failed"
      cancelled: "Cancelled"
      refunded: "Refunded"

      getting_older: "Dormant" # I18n for pseudo-state related to "new"
      stale: "Abandoned"       # I18n for pseudo-state related to "new"

    order_state_aasm_events:
      reserve: "Mark as 'reservation confirmed'"
      pay: "Mark as 'paid'"
      cancel: "Cancel order"
      refund: "Refund customer"
      force_refund: "Ignore no-refunds period and refund customer"

    page_type:
      normal: "Normal"
      contact_form: "Contact form"
      booking_form: "Booking form"
      blog: "Blog"
      events: "Events"
      encounters: "Encounters"

    revision:
      published: "Published"
      current: "Draft (%{time})"
      unpublished: "Old (%{time})"

  views:
    encounter_orders:
      seats:
        one: "One person taking part"
        other: "%{count} people taking part"
      confirm:
        booking:
          one: "Please check the details of your booking for one seat at “%{encounter_title}”."
          other: "Please check the details of your booking for %{count} seats at “%{encounter_title}”."

    orders:
      seats:
        one: "One seat"
        other: "%{count} seats"
      confirm:
        reservation:
          one: "Please confirm your reservation of one seat at “%{event_title}”."
          other: "Please confirm your reservation of %{count} seats at “%{event_title}”."
        booking:
          one: "Please check the details of your booking for one seat at “%{event_title}”."
          other: "Please check the details of your booking for %{count} seats at “%{event_title}”."
